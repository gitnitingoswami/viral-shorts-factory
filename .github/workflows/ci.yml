name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -w @vsf/api
      - run: npm run test -w web -- --watch=false
      - run: npm run build

  e2e:
    name: API integration tests (Postgres, Redis, S3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start dependencies (same compose file as local dev)
        run: docker compose -f infra/docker/compose.yaml up -d --wait postgres redis
      - name: Start S3-compatible storage
        run: |
          docker compose -f infra/docker/compose.yaml up -d storage
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 2; done
          echo "storage did not start"; exit 1
      - name: Pre-pull the code sandbox image (keeps the first sandbox run within test timeouts)
        run: docker pull -q node:24.22.3-alpine
      - name: Install FFmpeg and eSpeak NG (video rendering tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg espeak-ng
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - name: Migrations up/down/up + API e2e + worker
        run: npm run test:cov -w @vsf/api
      - if: failure()
        run: docker compose -f infra/docker/compose.yaml logs --no-color --tail 200

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t vsf-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t vsf-web:ci .
      - name: API image loads in production mode (no dev-only dependencies needed)
        run: docker run --rm -e NODE_ENV=production vsf-api:ci node -e "require('./dist/common/logging'); require('argon2'); console.log('ok')"
      - name: API image can render frames and run FFmpeg/eSpeak NG
        run: |
          docker run --rm vsf-api:ci node -e "const f=require('./dist/video/frames'); const png=f.renderPng(f.buildFrameSvg({width:720,height:1280,headline:'ok',code:null,caption:['ok'],progress:0,sceneLabel:'1/1'}).svg); if(png.length<1000) process.exit(1); console.log('frame ok', png.length)"
          docker run --rm vsf-api:ci sh -c "ffmpeg -hide_banner -version | head -1 && echo test | espeak-ng --stdout --stdin | wc -c"

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: npm audit (high and critical fail the build)
        run: npm audit --audit-level=high --omit=dev
