# Local development / CI dependencies. Credentials here are throwaway local defaults,
# overridable via environment; never reuse them anywhere else.
name: vsf
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-vsf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vsf_local_only}
      POSTGRES_DB: ${DB_NAME:-vsf}
    ports: ["${DB_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vsf"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local dev (MinIO images are no longer published).
  storage:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["${STORAGE_PORT:-8333}:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # ---- Application containers (optional): docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_ENDPOINT: http://storage:8333
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3100:3100"]

  worker:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_ENDPOINT: http://storage:8333
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    depends_on: [api]
    ports: ["8080:8080"]

volumes:
  pgdata:
  redisdata:
  s3data:
