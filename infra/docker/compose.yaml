# Local development / CI dependencies. Credentials here are throwaway local defaults,
# overridable via environment; never reuse them anywhere else.
name: vsf
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-vsf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vsf_local_only}
      POSTGRES_DB: ${DB_NAME:-vsf}
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local dev (MinIO images are no longer published).
  storage:
    # Pinned by digest (SECURITY_DESIGN T14); bump deliberately.
    image: chrislusf/seaweedfs@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:${STORAGE_PORT:-8333}:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # ---- Application containers (optional): docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../../.env
    environment: &app-env
      NODE_ENV: production
      COOKIE_SECURE: "true"
      SWAGGER_ENABLED: "false"
      TRUST_PROXY: "1" # exactly one proxy (nginx) in front of the API
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORAGE_ENDPOINT: http://storage:8333
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Not published: reachable only through nginx (web), so client IPs are trustworthy.

  worker:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    env_file: ../../.env
    environment:
      <<: *app-env
      TRUST_PROXY: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  redisdata:
  s3data:
