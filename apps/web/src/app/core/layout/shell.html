<a class="skip-link" href="#main-content">Skip to main content</a>
<mat-toolbar class="app-toolbar" role="banner">
  @if (isHandset()) {
    <button
      mat-icon-button
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="sidenav.opened"
      aria-controls="app-sidenav"
      (click)="sidenav.toggle()"
    >
      <span aria-hidden="true" class="menu-glyph">&#9776;</span>
    </button>
  }
  <a class="brand" routerLink="/dashboard">Viral Shorts Factory</a>
  <span class="spacer"></span>
  @if (user(); as u) {
    <span class="user-chip" data-testid="toolbar-user">
      <span class="user-email">{{ u.email }}</span>
      <span class="user-role">{{ u.role }}</span>
    </span>
  }
  <button mat-stroked-button type="button" (click)="logout()">Sign out</button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    id="app-sidenav"
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
    [fixedTopGap]="64"
  >
    <nav aria-label="Main navigation">
      <mat-nav-list>
        @for (item of navItems(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive="active-link"
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            (click)="onNavigate()"
          >
            {{ item.label }}
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
